[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-decider"
version = "0.1.0"
description = "decider plus Point answers: coordinates as calibrated Gaussian mixtures in one forward pass (fork of Mapika/decider)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mark Marosi" }]
dependencies = ["torch", "transformers>=5", "flash-linear-attention", "numpy", "huggingface_hub", "jinja2"]

[project.optional-dependencies]
serve = ["fastapi", "uvicorn[standard]", "httpx", "pillow"]
train = ["datasets", "accelerate", "scikit-learn", "pillow"]
games = ["gymnasium", "gym-super-mario-bros", "nes-py", "minigrid", "ale-py", "imageio"]
gguf = ["llama-cpp-python>=0.3.35,<0.4"]
metal = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
point = ["peft>=0.13", "tfrecord", "protobuf"]

[project.urls]
Upstream = "https://github.com/Mapika/decider"
Repository = "https://github.com/Mapika/decider"
Weights = "https://huggingface.co/Mapika/decider-2b"
Changelog = "https://github.com/Mapika/decider/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["decider*"]
